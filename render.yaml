services:
  - type: web
    name: daily-bugle
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "False"
      - key: JWT_SECRET_KEY
        generateValue: true
